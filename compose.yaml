services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - audit-data:/app/instance
    restart: unless-stopped
  collector:
    build: .
    env_file: .env
    command: ["python", "collector.py"]
    volumes:
      - audit-data:/app/instance
    restart: unless-stopped
volumes:
  audit-data:
